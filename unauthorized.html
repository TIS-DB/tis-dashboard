<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Access Denied</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #0f172a;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 40px;
      box-sizing: border-box;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      color: #15375f;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #15375f;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Access not authorised</h1>

    <p>
      Your Microsoft account does not currently have
      permission to access the TIS Management Dashboard.
    </p>

    <p>
      Please contact the dashboard administrator if you
      require access.
    </p>

    <a href="/.auth/logout?post_logout_redirect_uri=/">
      Sign out
    </a>

  </div>

</body>

</html>
